[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "nexuml-tutorial"
version = "0.1.0"
description = "Tutorial library for using NexuML"
requires-python = ">=3.12"
dependencies = [
    "nexuml[dali]>=0.2.1",
    "matplotlib>=3.8",
    "scikit-learn>=1.4",
    "torchaudio>=2.0",
    "torchmetrics>=1.0",
    "torchvision>=0.15",
]

[project.optional-dependencies]
advanced = ["nexuml[tuning,tracking]>=0.2.1"]
onnx = ["nexuml[export]>=0.2.1", "onnxruntime>=1.18"]

[project.entry-points."nexuml.libraries"]
nexuml-tutorial = "library"

[tool.hatch.build.targets.wheel]
packages = ["library"]
